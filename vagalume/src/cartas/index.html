<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><span id="status">Sua vez</span><span id="score">Vitórias 0 · Derrotas 0</span></header>
<main>
<div id="mesa"><div id="discard" class="pino"></div><button id="deck" class="pino monte" title="Comprar">0</button></div>
<ul id="log"></ul>
<div id="hand"></div>
</main>
<footer><button id="pass" hidden>Passar</button></footer>
<div id="overlay" hidden>
<div id="colors" hidden><button data-color="rosa" class="rosa"></button><button data-color="laranja" class="laranja"></button><button data-color="lima" class="lima"></button><button data-color="azul" class="azul"></button></div>
<div id="result" hidden></div>
<button id="restart" hidden>Nova partida</button>
</div>
<script type="module" src="altura.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
