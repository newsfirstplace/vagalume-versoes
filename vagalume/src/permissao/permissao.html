<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vagalume — permissão</title>
  <style>
    body { margin: 0; padding: 18px; background: #12161f; color: #e8edf5; font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
    h1 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 15px; }
    h1::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #d6f24a; box-shadow: 0 0 8px #d6f24a; }
    p { margin: 0 0 10px; color: #a9b4c7; }
    strong { color: #d6f24a; }
    .acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
    button { font: inherit; border-radius: 6px; padding: 6px 14px; cursor: pointer; border: 1px solid #36435c; background: #242d3d; color: #e8edf5; }
    button.primario { background: #d6f24a; border-color: #d6f24a; color: #12161f; font-weight: 600; }
    #estado { min-height: 1.5em; color: #9be8ad; }
  </style>
</head>
<body>
  <h1 id="titulo">Permissão</h1>
  <p id="texto1"></p>
  <p id="texto2"></p>
  <p id="estado"></p>
  <div class="acoes">
    <button type="button" id="cancelar">Agora não</button>
    <button type="button" id="permitir" class="primario">Permitir</button>
  </div>
  <script src="permissao.js"></script>
</body>
</html>
